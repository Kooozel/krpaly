name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv resolves the environment from derive/uv.lock on every run rather
      # than restoring one that drifts into staleness — it is two dev
      # dependencies and takes seconds. The version floor comes from
      # derive/pyproject.toml so CI and a local shell cannot disagree about it,
      # and uv fetches the CPython named in derive/.python-version itself, so
      # there is no setup-python here. The action is pinned to an exact patch
      # because it publishes no floating major tag.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version-file: derive/pyproject.toml
          enable-cache: false

      # One job, one required context, one step per area — and the steps live
      # in the Makefile, so an area turning on is a change to that file rather
      # than to this one. setup-node lands with web/, alongside the step that
      # needs it.
      - run: make check
