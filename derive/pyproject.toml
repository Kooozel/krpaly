# derive/ is a batch pipeline, not a distributable package: no [build-system],
# so uv treats this as a virtual project and installs the dev group without
# trying to build anything.
[project]
name = "krpaly-derive"
version = "0.0.0"
description = "Offline derivation: OSM .pbf → DMR5G sampling → climb-engine → Postgres"
requires-python = ">=3.13"
# psycopg for the migration runner and #11's bulk load — [binary] so a
# contributor needs no libpq and no compiler. The other four are the
# extraction stage: osmium reads the .pbf (node-location cache, area
# assembly, and the SimpleWriter that builds the fixture), shapely holds
# the buffered boundary and its prepared membership test, pyproj gets it
# into EPSG:5514 so a 10 km buffer is 10 km, and pyarrow writes the
# GeoParquet.
dependencies = [
    "psycopg[binary]>=3.2",
    "osmium>=4.3",
    "shapely>=2.1",
    "pyproj>=3.8",
    "pyarrow>=21",
    # numpy is rasterio's own dependency, named here anyway because dem.py
    # imports it directly — a million vertices transformed one at a time is
    # minutes of pure Python, and counting nodata over a window is one call.
    "numpy>=2.1",
    # rasterio validates each arriving window against the grid it was asked
    # for — a resampled response is still a valid GeoTIFF — and it is what
    # sample.py reads the mosaic through. It landed with #7 rather than #8
    # because #7 decides the local form, and a VRT that no test has opened is a
    # decision made on paper. The wheel carries its own GDAL, so no system
    # library.
    "rasterio>=1.4",
]

[dependency-groups]
# sqlfluff lints db/, not derive/, which is slightly odd — but derive/ is
# the repo's only Python toolchain, and a second lockfile for one linter
# is worse than one misfiled dependency.
dev = ["ruff>=0.14", "pytest>=8.4", "sqlfluff>=3.4"]

# One version floor that a local shell and CI both read — the `check` job
# points setup-uv at this file rather than naming a version of its own.
[tool.uv]
required-version = ">=0.9"

# 100 to match the printWidth climb-engine's prettier uses, so the three repos
# wrap alike.
[tool.ruff]
line-length = 100
target-version = "py313"

# E/W/F is pycodestyle and pyflakes, I is import order, UP keeps syntax at the
# pinned version, B is the bugbear set. Nothing type-related: derive/ shells
# out to Node and reads a raster, and its interesting bugs are geometric.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

# pythonpath because there is no [build-system]: nothing installs the
# package, and pytest puts derive/tests on sys.path rather than derive,
# so `import krpaly_derive` needs the rootdir added explicitly.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
